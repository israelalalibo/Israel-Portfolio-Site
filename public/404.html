<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Israel Alalibo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #1e3a5f;
        color: #fff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 32rem; }
      .code { color: #d4a77a; font-weight: 700; font-size: 1.125rem; margin: 0 0 0.5rem; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 1rem; }
      p { color: #d1d5db; line-height: 1.6; margin: 0 0 2rem; }
      a {
        display: inline-block;
        background: #8e6136;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        padding: 0.875rem 1.75rem;
        border-radius: 0.5rem;
      }
      a:hover { background: #744d2b; }
      a:focus-visible { outline: 3px solid #d4a77a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Back to the homepage</a>
    </main>
  </body>
</html>
